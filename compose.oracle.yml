x-api-image: &api-image
  image: psx-ai-portfolio-api:oracle
  build:
    context: ./apps/api
  env_file: .env.oracle

x-worker: &worker
  <<: *api-image
  restart: "no"
  profiles: ["ingestion"]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started

x-evidence-worker: &evidence-worker
  <<: *worker
  restart: unless-stopped
  volumes:
    - ${PSX_DATA_ROOT:-/srv/psx}/evidence-spool:/data/evidence-spool

x-pipeline-worker: &pipeline-worker
  <<: *evidence-worker
  profiles: ["pipeline"]
  environment:
    PIPELINE_ENABLED: "true"
    PIPELINE_ENRICHMENT_ENABLED: "false"
    PIPELINE_DATA_ROOT: /pipeline-data
    PIPELINE_DISPATCH_SCOPE: ${PIPELINE_DISPATCH_SCOPE:-}
  volumes:
    - ${PSX_DATA_ROOT:-/srv/psx}/evidence-spool:/data/evidence-spool
    - ${PSX_DATA_ROOT:-/srv/psx}/evidence-spool:/pipeline-data:ro

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env.oracle
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${PSX_DATA_ROOT:-/srv/psx}/postgres:/var/lib/postgresql/data
      - ./ops/oracle/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${PSX_DATA_ROOT:-/srv/psx}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    env_file: .env.oracle
    restart: unless-stopped
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ${PSX_DATA_ROOT:-/srv/psx}/minio:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    env_file: .env.oracle
    restart: "no"
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set psx http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing psx/"$$ARTIFACT_S3_BUCKET";
        mc anonymous set none psx/"$$ARTIFACT_S3_BUCKET"

  api:
    <<: *api-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - ${PSX_DATA_ROOT:-/srv/psx}/import:/import:ro
      - ${PSX_DATA_ROOT:-/srv/psx}/backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: psx-ai-portfolio-web:oracle
    build:
      context: ./apps/web
    env_file: .env.oracle
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  worker-broad-fundamentals:
    <<: *worker
    command: celery -A app.celery_app worker -Q broad_fundamentals --concurrency=2 --loglevel=INFO

  worker-dps-history:
    <<: *worker
    command: celery -A app.celery_app worker -Q dps_history --concurrency=4 --loglevel=INFO

  worker-financial-download:
    <<: *worker
    command: celery -A app.celery_app worker -Q financial_download --concurrency=4 --loglevel=INFO

  worker-extract:
    <<: *worker
    command: celery -A app.celery_app worker -Q financial_extract --concurrency=1 --loglevel=INFO

  worker-macro:
    <<: *worker
    command: celery -A app.celery_app worker -P threads -n macro@%h -Q macro --concurrency=1 --loglevel=INFO

  worker-evidence-discovery:
    <<: *evidence-worker
    command: celery -A app.celery_app worker -n discovery@%h -Q evidence_discovery --concurrency=1 --loglevel=INFO

  worker-evidence-fetch:
    <<: *evidence-worker
    command: celery -A app.celery_app worker -n fetch@%h -Q evidence_fetch --concurrency=2 --loglevel=INFO

  worker-evidence-parse:
    <<: *evidence-worker
    command: celery -A app.celery_app worker -n parse@%h -Q evidence_parse --concurrency=1 --loglevel=INFO

  worker-evidence-pdf:
    <<: *evidence-worker
    command: celery -A app.celery_app worker -n pdf@%h -Q evidence_pdf --concurrency=1 --loglevel=INFO

  worker-evidence-index:
    <<: *evidence-worker
    # Shared OCR/embedding lane: do not also start worker-evidence-pdf.
    command: celery -A app.celery_app worker -n index@%h -Q evidence_pdf,evidence_index --concurrency=1 --loglevel=INFO

  worker-historical-hydrate:
    <<: *evidence-worker
    command: celery -A app.celery_app worker -n historical@%h -Q historical_hydrate --concurrency=1 --loglevel=INFO

  market-scheduler:
    <<: *api-image
    profiles: ["scheduling"]
    restart: unless-stopped
    command: python -m app.jobs.market_daily
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  phase2-scheduler:
    <<: *api-image
    profiles: ["scheduling"]
    restart: "no"
    command: python -m app.jobs.phase2_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  macro-scheduler:
    <<: *api-image
    profiles: ["scheduling"]
    restart: "no"
    command: python -m app.jobs.macro_scheduler
    environment:
      MACRO_INGESTION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  evidence-scheduler:
    <<: *api-image
    profiles: ["scheduling"]
    restart: unless-stopped
    command: python -m app.jobs.evidence_scheduler
    environment:
      EVIDENCE_ENABLED: "true"
    volumes:
      - ${PSX_DATA_ROOT:-/srv/psx}/evidence-spool:/data/evidence-spool
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  research-worker:
    <<: *api-image
    profiles: ["research"]
    restart: unless-stopped
    command: python -m app.jobs.research_worker
    depends_on:
      postgres:
        condition: service_healthy

  pipeline-scheduler:
    <<: *pipeline-worker
    command: python -m app.jobs.pipeline_scheduler

  pipeline-discovery:
    <<: *pipeline-worker
    command: celery -A app.celery_app worker -n pipeline-discovery@%h -Q pipeline_discovery --concurrency=1 --loglevel=INFO

  pipeline-fetch:
    <<: *pipeline-worker
    command: celery -A app.celery_app worker -n pipeline-fetch@%h -Q pipeline_fetch --concurrency=2 --loglevel=INFO

  pipeline-parse:
    <<: *pipeline-worker
    command: celery -A app.celery_app worker -n pipeline-parse@%h -Q pipeline_parse --concurrency=1 --loglevel=INFO

  pipeline-enrich:
    <<: *pipeline-worker
    command: celery -A app.celery_app worker -n pipeline-enrich@%h -Q pipeline_enrich --concurrency=1 --loglevel=INFO

  pipeline-heavy:
    <<: *pipeline-worker
    command: celery -A app.celery_app worker -n pipeline-heavy@%h -Q pipeline_heavy --concurrency=1 --loglevel=INFO

  pipeline-intelligence:
    <<: *pipeline-worker
    command: celery -A app.celery_app worker -n pipeline-intelligence@%h -Q pipeline_intelligence --concurrency=1 --loglevel=INFO

  pipeline-numeric:
    <<: *pipeline-worker
    command: celery -A app.celery_app worker -n pipeline-numeric@%h -Q pipeline_numeric --concurrency=1 --loglevel=INFO

  pipeline-model:
    <<: *pipeline-worker
    # Only explicit reviewed jobs may enter this queue. No paid fallback.
    environment:
      PIPELINE_ENABLED: "true"
      PIPELINE_ENRICHMENT_ENABLED: "true"
      PIPELINE_DATA_ROOT: /pipeline-data
    command: celery -A app.celery_app worker -n pipeline-model@%h -Q pipeline_model --concurrency=1 --loglevel=INFO

volumes:
  evidence_spool:
