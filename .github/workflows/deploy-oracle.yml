name: Deploy to Oracle

on:
  push:
    branches:
      - main
      - company-evidence
      - ui-updates
  workflow_dispatch:

concurrency:
  group: oracle-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_deploy
          chmod 600 ~/.ssh/oracle_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy exact commit
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"

          ssh \
            -i ~/.ssh/oracle_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$ORACLE_USER@$ORACLE_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'EOF'
          set -euo pipefail

          deploy_sha="$1"
          cd /home/ubuntu/finance_project

          exec 9>/tmp/psx-oracle-deploy.lock
          if ! flock -n 9; then
            echo "Another Oracle deployment is already running." >&2
            exit 1
          fi

          echo "== Fetching the triggering commit =="
          git fetch origin "$deploy_sha"
          git cat-file -e "${deploy_sha}^{commit}"
          git reset --hard "$deploy_sha"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Tracked Oracle checkout is not clean after reset." >&2
            exit 1
          fi

          echo "== Deploying (ingestion is paused and restored automatically) =="
          # ops/oracle-deploy builds first, drains and stops only the running
          # ingestion services, migrates, redeploys api/web/research-worker, then
          # restarts exactly what was running. It never purges Redis queues.
          ./ops/oracle-deploy
          printf 'DEPLOY SUCCESSFUL: %s\n' "$deploy_sha"
          EOF
