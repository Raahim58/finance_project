services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: psx_ai
      POSTGRES_USER: psx
      POSTGRES_PASSWORD: psx
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psx -d psx_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker-broad-fundamentals:
    build:
      context: ./apps/api
    command: celery -A app.celery_app worker -Q broad_fundamentals --concurrency=20 --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - source_artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

  worker-dps-history:
    build:
      context: ./apps/api
    command: celery -A app.celery_app worker -Q dps_history --concurrency=24 --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - source_artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

  worker-financial-download:
    build:
      context: ./apps/api
    command: celery -A app.celery_app worker -Q financial_download --concurrency=12 --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - source_artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

  worker-extract:
    build:
      context: ./apps/api
    command: celery -A app.celery_app worker -Q financial_extract --concurrency=3 --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - source_artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  source_artifacts:
