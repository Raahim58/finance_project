services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: psx_ai
      POSTGRES_USER: psx
      POSTGRES_PASSWORD: psx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psx -d psx_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
