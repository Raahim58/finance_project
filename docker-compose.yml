x-worker-image: &worker-image
  image: psx-ai-portfolio-api:local
  pull_policy: build
  restart: unless-stopped
  build:
    context: ./apps/api

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: psx_ai
      POSTGRES_USER: psx
      POSTGRES_PASSWORD: psx
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psx -d psx_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker-broad-fundamentals:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q broad_fundamentals --concurrency=20 --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - source_artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

  worker-dps-history:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q dps_history --concurrency=24 --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - source_artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

  worker-financial-download:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q financial_download --concurrency=12 --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - source_artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

  worker-extract:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q financial_extract --concurrency=3 --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
    volumes:
      - source_artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

  phase2-scheduler:
    <<: *worker-image
    command: python -m app.jobs.phase2_scheduler
    environment:
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
      PHASE2_REFILL_SECONDS: 2
    volumes:
      - source_artifacts:/data/artifacts
    depends_on:
      - postgres
      - redis

  worker-evidence-discovery:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q evidence_discovery --concurrency=4 --loglevel=INFO
    environment: &evidence-environment
      DATABASE_URL: postgresql+psycopg://psx:psx@postgres:5432/psx_ai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SOURCE_ARTIFACT_ROOT: /data/artifacts
      EVIDENCE_ENABLED: "true"
    volumes: &evidence-volumes
      - source_artifacts:/data/artifacts
    depends_on: &evidence-dependencies
      - postgres
      - redis

  worker-evidence-fetch:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q evidence_fetch --concurrency=16 --loglevel=INFO
    environment: *evidence-environment
    volumes: *evidence-volumes
    depends_on: *evidence-dependencies

  worker-evidence-parse:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q evidence_parse --concurrency=6 --loglevel=INFO
    environment: *evidence-environment
    volumes: *evidence-volumes
    depends_on: *evidence-dependencies

  worker-evidence-pdf:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q evidence_pdf --concurrency=2 --loglevel=INFO
    environment: *evidence-environment
    volumes: *evidence-volumes
    depends_on: *evidence-dependencies

  worker-evidence-index:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q evidence_index --concurrency=4 --loglevel=INFO
    environment: *evidence-environment
    volumes: *evidence-volumes
    depends_on: *evidence-dependencies

  worker-historical-hydrate:
    <<: *worker-image
    command: celery -A app.celery_app worker -Q historical_hydrate --concurrency=2 --loglevel=INFO
    environment: *evidence-environment
    volumes: *evidence-volumes
    depends_on: *evidence-dependencies

  evidence-scheduler:
    <<: *worker-image
    command: python -m app.jobs.evidence_scheduler
    environment: *evidence-environment
    volumes: *evidence-volumes
    depends_on: *evidence-dependencies

volumes:
  postgres_data:
  redis_data:
  source_artifacts:
